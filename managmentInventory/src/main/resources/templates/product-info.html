<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.nameProduct}">Producto</title>
</head>
<body>

    <h1>Data Product</h1>

    <p><strong>ID:</strong> <span th:text="${product.id}"></span></p>
    <p><strong>Nombre:</strong> <span th:text="${product.nameProduct}"></span></p>
    <p><strong>Stock:</strong> <span th:text="${product.stockProduct}"></span></p>
    <p><strong>Precio:</strong> <span th:text="${product.priceProduct}"></span></p>

</body>
</html>
